[package]
name = "eve-scouting"
version = "0.1.0"
edition = "2024"
description = "EVE Online scouting desktop client (Rust + Rune)"

[dependencies]
# Rune is pre-release: pin a revision of its `dev` branch (never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "cfd4340f700f4534bfd56af4923cde925a512682" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "cfd4340f700f4534bfd56af4923cde925a512682" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
